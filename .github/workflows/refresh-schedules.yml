name: Refresh schedules

on:
  schedule:
    - cron: "17 5-21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-schedules
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/crawl.mjs
      - name: Commit changed schedules
        run: |
          git add public/data data
          if git diff --cached --quiet; then
            echo "Schedules unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update room schedules"
          git push
